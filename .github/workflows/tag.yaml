name: Create Release and Export Version

on:
  push:
    tags:
      - 'v*'  # Trigger only on tags like v1.0.0 or v2.0.0

permissions:
  contents: write  # Required to create releases

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Resolve tag to module path and directory
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          MAJOR="${TAG%%.*}"  # e.g. "v2" from "v2.1.3"
          case "$MAJOR" in
            v0|v1)
              # Majors 0 and 1 carry no import path suffix: the module is at the repo root.
              DIR="."
              MODULE="github.com/krelinga/go-views"
              ;;
            *)
              # Later majors live in a subdirectory named after the suffix.
              DIR="$MAJOR"
              MODULE="github.com/krelinga/go-views/$MAJOR"
              ;;
          esac
          if [ ! -f "$DIR/go.mod" ]; then
            echo "::error::tag $TAG implies module directory '$DIR', which has no go.mod"
            exit 1
          fi
          if ! grep -qx "module $MODULE" "$DIR/go.mod"; then
            echo "::error::$DIR/go.mod does not declare 'module $MODULE'"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "DIR=$DIR" >> "$GITHUB_ENV"
          echo "MODULE=$MODULE" >> "$GITHUB_ENV"

      - name: Run Go tests for every module
        run: |
          set -euo pipefail
          # Each major is its own module, so ./... from the root does not reach
          # the others. Test them all; the tagged one is the release gate.
          find . -name go.mod -not -path './.git/*' -print0 |
            xargs -0 -n1 dirname |
            sort |
            while read -r mod; do
              echo "== $mod =="
              (cd "$mod" && go mod download && go test ./...)
            done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export tagged version with go list -m
        working-directory: ${{ env.DIR }}
        run: GOPROXY=proxy.golang.org go list -m "${MODULE}@${TAG}"
